<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://*.supabase.co; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اسأل عن رحلتك</title>
<style>
  :root{--pri:#0e7490;--bg:#eceff3;--txt:#17212e;--mut:#5f6c7e;--bd:#dce2ea;--bad:#c2303a;--ink:#14213d}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI","Noto Sans Arabic",system-ui,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:16px;line-height:1.55}
  .top{background:var(--ink);color:#fff;text-align:center;padding:26px 16px 34px;border-bottom:3px solid var(--pri)}
  .top h1{margin:0;font-size:23px}.top p{margin:6px 0 0;color:#cbd5e6;font-size:14px}
  .box{max-width:520px;margin:-18px auto 24px;padding:0 14px}
  .card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(20,33,61,.06),0 10px 28px rgba(20,33,61,.1)}
  label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px;font-weight:600}
  input,textarea,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:#fff;color:var(--txt)}
  input:focus,textarea:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 35%,transparent);border-color:var(--pri)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:11px;background:var(--pri);color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.6}
  #msg{margin-top:12px;color:var(--bad);font-size:14px;line-height:1.7;white-space:pre-wrap}
  .done{text-align:center;padding:16px 4px}.done b{font-size:40px;display:block}
  .hp{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}
  .foot{text-align:center;color:var(--mut);font-size:13px;margin-top:14px}
</style>
</head>
<body>
<div class="top"><h1 id="ttl">✈ اسأل عن رحلتك</h1><p>اكتب وجهتك وسنوافيك بأفضل سعر في أقرب وقت</p></div>
<div class="box"><div class="card">
  <form id="f" autocomplete="on">
    <label>الاسم *</label><input id="name" required maxlength="80" autocomplete="name">
    <label>رقم الهاتف / واتساب *</label><input id="phone" required inputmode="tel" dir="ltr" style="text-align:right" maxlength="25" autocomplete="tel">
    <label>الجنس (اختياري)</label><select id="gender"><option value="">— اختر —</option><option value="m">ذكر</option><option value="f">أنثى</option></select>
    <div class="row"><div><label>من (مدينة الإقلاع)</label><input id="origin" maxlength="80" placeholder="القاهرة"></div>
      <div><label>إلى (الوجهة) *</label><input id="destination" required maxlength="80" placeholder="الرياض"></div></div>
    <div class="row"><div><label>تاريخ السفر المتوقع</label><input type="date" id="travel"></div>
      <div><label>عدد الركاب</label><input type="number" id="pax" min="1" max="50" value="1"></div></div>
    <label>ملاحظات (اختياري)</label><textarea id="notes" rows="3" maxlength="500" placeholder="ذهاب وعودة؟ ميزانية؟ أي تفاصيل..."></textarea>
    <label>كود صديق أحالك (اختياري)</label><input id="ref" maxlength="20" dir="ltr" style="text-align:right">
    <div class="hp"><label>لا تملأ هذا الحقل</label><input id="website" tabindex="-1" autocomplete="off"></div>
    <div id="cap" style="margin-top:14px;display:flex;justify-content:center"></div>
    <button type="submit" id="go">إرسال الطلب</button>
    <div id="msg"></div>
  </form>
  <div id="ok" class="done" style="display:none"><b>✅</b><h2 style="margin:8px 0">وصلنا طلبك!</h2><div style="color:var(--mut);line-height:1.8">سنتواصل معك قريبًا على الرقم الذي كتبته.<span id="ph"></span></div></div>
</div>
<div class="foot" id="foot"></div></div>
<script src="config.js" onerror="void 0"></script>
<script>
(function(){
  const $ = id => document.getElementById(id), C = window.OFFICE_CONFIG || {};
  const toLat = t => String(t || '').replace(/[\u0660-\u0669]/g, c => c.charCodeAt(0) - 1632).replace(/[\u06f0-\u06f9]/g, c => c.charCodeAt(0) - 1776);
  if (/^#[0-9a-f]{3,8}$/i.test(C.color || '')) document.documentElement.style.setProperty('--pri', C.color);
  const norm = u => { u = String(u || '').trim(); try { return new URL(u).origin; } catch(e) { return u.replace(/\/+$/, ''); } };
  const BASE = norm(C.url), KEY = (C.key || '').trim();
  if (C.name) { document.title = C.name + ' - اسأل عن رحلتك'; $('ttl').textContent = '✈ ' + C.name; }
  if (C.phone) { $('ph').textContent = ' أو اتصل بنا: ' + C.phone; $('foot').textContent = '📞 ' + C.phone; }
  try { const r = new URLSearchParams(location.search).get('ref'); if (r) $('ref').value = r.slice(0, 20); } catch(e) {}
  /* Cloudflare Turnstile (اختياري حتى تضبطه: ضع المفتاح العام في config.js باسم turnstile) */
  const TS = /^[0-9A-Za-z_-]{10,80}$/.test(C.turnstile || '') ? C.turnstile : '';
  let capToken = '', capId = null;
  const capReset = () => { capToken = ''; try { if (capId !== null && window.turnstile) window.turnstile.reset(capId); } catch(_) {} };
  if (TS) {
    window.__tsReady = () => { capId = window.turnstile.render('#cap', {sitekey: TS, language: 'ar', callback: t => { capToken = t; }, 'expired-callback': () => { capToken = ''; }, 'error-callback': () => { capToken = ''; }}); };
    const s = document.createElement('script'); s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=__tsReady'; s.async = true; document.head.appendChild(s);
  }
  $('f').onsubmit = async e => {
    e.preventDefault(); const m = $('msg'); m.textContent = '';
    if ($('website').value) { $('f').style.display = 'none'; $('ok').style.display = ''; return; }   /* فخ للروبوتات */
    if (!BASE || !KEY) { m.textContent = 'الصفحة غير مُعدّة بعد (config.js).'; return; }
    const phone = toLat($('phone').value.trim());
    if (phone.replace(/\D/g, '').length < 7) { m.textContent = 'اكتب رقم هاتف صحيح.'; return; }
    let last = 0; try { last = +localStorage.getItem('ask_last') || 0; } catch(_) {}
    if (Date.now() - last < 30000) { m.textContent = 'تم إرسال طلب منذ لحظات، انتظر قليلًا.'; return; }
    if (TS && !capToken) { m.textContent = 'أكمل التحقق «أنا لست روبوتًا» أولًا.'; return; }
    $('go').disabled = true;
    try {
      let auth = {apikey: KEY};
      if (TS) {
        /* تسجيل دخول مجهول يتحقق منه Supabase من الكابتشا على الخادم، ولا يُقبل الطلب بدونه */
        const a = await fetch(BASE + '/auth/v1/signup', {method: 'POST', headers: {apikey: KEY, 'Content-Type': 'application/json'},
          body: JSON.stringify({data: {}, gotrue_meta_security: {captcha_token: capToken}})});
        const aj = await a.json().catch(() => ({}));
        if (!a.ok || !aj.access_token) { capReset(); throw new Error('captcha:' + (aj.msg || aj.error_description || aj.message || aj.error || ('HTTP ' + a.status))); }
        auth = {apikey: KEY, Authorization: 'Bearer ' + aj.access_token};
      }
      const body = {name: $('name').value.trim(), phone, origin: $('origin').value.trim(), destination: $('destination').value.trim(),
        travel: $('travel').value || null, pax: Math.min(50, Math.max(1, Math.round(+$('pax').value || 1))), notes: $('notes').value.trim(), ref_code: toLat($('ref').value.trim()).toUpperCase(), gender: $('gender').value};
      const r = await fetch(BASE + '/rest/v1/inquiries', {method: 'POST', headers: Object.assign({'Content-Type': 'application/json', Prefer: 'return=minimal'}, auth), body: JSON.stringify(body)});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      try { localStorage.setItem('ask_last', String(Date.now())); } catch(_) {}
      $('f').style.display = 'none'; $('ok').style.display = '';
    } catch(err) { m.textContent = /^captcha/.test(err.message) ? 'فشل التحقق، أعد المحاولة. [' + err.message.slice(8) + ']' : 'تعذر إرسال الطلب، تأكد من الإنترنت وحاول مرة أخرى.'; $('go').disabled = false; capReset(); }
  };
})();
</script>
</body>
</html>
